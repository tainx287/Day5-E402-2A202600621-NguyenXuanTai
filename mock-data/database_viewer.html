    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 30, 49, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.1) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.05) 0, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(to right, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Tabs Container */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            background: rgba(17, 24, 39, 0.5);
            padding: 0.4rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03);
        }

        .tab-btn.active {
            color: #fff;
            background: var(--accent-color);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* Content Sections */
        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hotel Info Card */
        .hotel-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 2rem;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
        }

        @media (max-width: 768px) {
            .hotel-card {
                grid-template-columns: 1fr;
            }
        }

        .hotel-hero-img {
            width: 100%;
            height: 100%;
            min-height: 350px;
            object-fit: cover;
            border-right: 1px solid var(--border-color);
        }

        .hotel-details {
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hotel-details h2 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #fff;
        }

        .hotel-meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.2rem;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .meta-item {
            font-size: 0.9rem;
        }

        .meta-item span {
            display: block;
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
        }

        .meta-item p {
            color: var(--text-primary);
            font-weight: 500;
        }

        /* General Amenities Table */
        .section-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 2rem 0 1rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        th, td {
            padding: 1rem 1.25rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: rgba(17, 24, 39, 0.8);
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .badge-free {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
        }

        .badge-paid {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger-color);
        }

        .badge-source {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-color);
        }

        /* Room Cards Grid */
        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
        }

        .room-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .room-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .room-img-container {
            height: 240px;
            position: relative;
            background: #111;
        }

        .room-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.2s ease;
        }

        .room-price {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(8px);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            color: var(--success-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Gallery Thumbnails styles */
        .thumbnail-gallery {
            display: flex;
            gap: 0.4rem;
            padding: 0.6rem 1rem;
            background: rgba(17, 24, 39, 0.5);
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: thin;
        }

        .thumb-img {
            width: 55px;
            height: 42px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .thumb-img:hover {
            transform: scale(1.05);
            border-color: rgba(59, 130, 246, 0.4);
        }

        .thumb-img.active {
            border-color: var(--accent-color);
        }

        .room-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .room-info h3 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .room-desc {
            color: var(--text-secondary);
            font-size: 0.88rem;
            line-height: 1.5;
            margin-bottom: 1.2rem;
        }

        .room-specs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem;
            margin-bottom: 1.2rem;
            padding-bottom: 1.2rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        .room-specs span {
            color: var(--text-secondary);
        }

        .room-specs p {
            color: var(--text-primary);
            font-weight: 500;
            margin-top: 0.1rem;
        }

        .room-amenity-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 1rem;
        }

        .amenity-tag {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0.25rem 0.5rem;
            font-size: 0.78rem;
            border-radius: 6px;
            color: var(--text-primary);
        }

        .room-notes {
            margin-top: auto;
            background: rgba(245, 158, 11, 0.06);
            border-left: 3px solid var(--warning-color);
            padding: 0.75rem;
            font-size: 0.8rem;
            color: #f3f4f6;
            border-radius: 0 6px 6px 0;
        }

        /* Nearby Places Grid */
        .places-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .place-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
        }

        .place-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .place-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            max-width: 70%;
        }

        .place-dist {
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-color);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
        }

        .place-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 1rem;
        }

        .place-footer {
            margin-top: auto;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.8rem;
        }

        .place-footer span {
            color: var(--text-secondary);
            display: block;
            margin-bottom: 0.2rem;
        }

        .place-footer p {
            color: var(--text-primary);
        }

        /* FAQ & Accordion */
        .faq-list {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .faq-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: border-color 0.3s ease;
        }

        .faq-item:hover {
            border-color: rgba(59, 130, 246, 0.2);
        }

        .faq-question {
            width: 100%;
            padding: 1.25rem;
            background: transparent;
            border: none;
            color: #fff;
            text-align: left;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .faq-question::after {
            content: '+';
            font-size: 1.5rem;
            color: var(--text-secondary);
            transition: transform 0.3s ease;
        }

        .faq-item.active .faq-question::after {
            transform: rotate(45deg);
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: rgba(17, 24, 39, 0.3);
        }

        .faq-answer-content {
            padding: 1.25rem;
            font-size: 0.92rem;
            color: var(--text-secondary);
            line-height: 1.6;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .faq-meta {
            display: flex;
            gap: 1rem;
            margin-top: 0.75rem;
            font-size: 0.75rem;
        }
    </style>
</head>

        function switchTab(tabId) {
            // Update active buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Show active section
            document.querySelectorAll('.tab-content').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');
        }

        function loadHotelInfo() {
            const info = database.hotel_info;
            document.getElementById('hotel-name').textContent = info.hotel_name;
            document.getElementById('hotel-desc').textContent = info.full_description;
            document.getElementById('hotel-address').textContent = info.address;
            document.getElementById('hotel-area').textContent = info.area;
            document.getElementById('hotel-checkin').textContent = info.checkin_time;
            document.getElementById('hotel-checkout').textContent = info.checkout_time;
            document.getElementById('hotel-img').src = info.general_images[0];

            // Load General Amenities Table
            const tbody = document.getElementById('amenities-table-body');
            tbody.innerHTML = '';
            info.general_amenities.forEach(am => {
                const tr = document.createElement('tr');
                
                const avBadge = am.available 
                    ? `<span class="badge badge-free" style="background: rgba(16, 185, 129, 0.15)">Có</span>`
                    : `<span class="badge badge-paid" style="background: rgba(239, 68, 68, 0.15)">Không</span>`;

                const freeBadge = am.is_free 
                    ? `<span class="badge badge-free">Miễn phí</span>`
                    : `<span class="badge badge-paid">Tính phí</span>`;

                tr.innerHTML = `
                    <td style="font-weight: 500; color: #fff;">${am.amenity_name}</td>
                    <td>${avBadge}</td>
                    <td>${freeBadge}</td>
                    <td style="color: var(--text-secondary); font-size: 0.9rem;">${am.fee_note}</td>
                    <td style="color: var(--text-secondary); font-size: 0.9rem;">${am.applies_to_room}</td>
                    <td><span class="badge badge-source">${am.source}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function loadRoomTypes() {
            const grid = document.getElementById('rooms-grid');
            grid.innerHTML = '';
            database.room_types.forEach(room => {
                const card = document.createElement('div');
                card.className = 'room-card';
                
                const amenitiesHTML = room.room_amenities.map(am => `
                    <span class="amenity-tag">${am}</span>
                `).join('');

                const thumbsHTML = room.room_images.map((img, idx) => `
                    <img class="thumb-img ${idx === 0 ? 'active' : ''}" 
                         src="${img.url}" 
                         alt="${img.caption}" 
                         title="${img.caption}"
                         onclick="changeRoomImage('${room.room_id}', '${img.url}', this)">
                `).join('');

                card.innerHTML = `
                    <div class="room-img-container">
                        <img class="room-img" id="main-img-${room.room_id}" src="${room.room_images[0].url}" alt="${room.room_name}">
                        <div class="room-price">${room.price_from.toLocaleString('vi-VN')}đ / đêm</div>
                    </div>
                    <div class="thumbnail-gallery">
                        ${thumbsHTML}
                    </div>
                    <div class="room-info">
                        <h3>${room.room_name}</h3>
                        <p class="room-desc">${room.room_description}</p>
                        <div class="room-specs">
                            <div>
                                <span>Diện tích</span>
                                <p>${room.area_m2} m²</p>
                            </div>
                            <div>
                                <span>Khách tối đa</span>
                                <p>${room.max_guests} người</p>
                            </div>
                            <div>
                                <span>Loại giường</span>
                                <p>${room.bed_type}</p>
                            </div>
                            <div>
                                <span>Tầm nhìn</span>
                                <p>${room.view}</p>
                            </div>
                        </div>
                        <div class="room-amenity-tags">
                            ${amenitiesHTML}
                        </div>
                        <div class="room-notes">
                            <strong>Lưu ý:</strong> ${room.notes}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function changeRoomImage(roomId, imgUrl, thumbElem) {
            const mainImg = document.getElementById(`main-img-${roomId}`);
            mainImg.style.opacity = 0.3;
            setTimeout(() => {
                mainImg.src = imgUrl;
                mainImg.style.opacity = 1;
            }, 150);
            
            thumbElem.parentElement.querySelectorAll('.thumb-img').forEach(t => t.classList.remove('active'));
            thumbElem.classList.add('active');
        }

        function loadNearbyPlaces() {
            const grid = document.getElementById('places-grid');
            grid.innerHTML = '';
            database.nearby_places.forEach(place => {
                const card = document.createElement('div');
                card.className = 'place-card';
                
                let categoryName = place.category;
                if(place.category === 'attraction') categoryName = 'Điểm tham quan';
                else if(place.category === 'restaurant') categoryName = 'Nhà hàng / Café';
                else if(place.category === 'atm') categoryName = 'ATM';
                else if(place.category === 'convenience_store') categoryName = 'Cửa hàng tiện lợi';
                else if(place.category === 'pharmacy') categoryName = 'Nhà thuốc';

                card.innerHTML = `
                    <div class="place-header">
                        <h3>${place.place_name}</h3>
                        <span class="place-dist">${place.distance}</span>
                    </div>
                    <span class="badge badge-source" style="margin-bottom: 0.75rem; align-self: flex-start;">${categoryName}</span>
                    <p class="place-desc">${place.short_description}</p>
                    <div class="place-footer">
                        <span>Phù hợp cho</span>
                        <p>${place.suitable_for}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function loadFAQ() {
            const container = document.getElementById('faq-list');
            container.innerHTML = '';
            database.policy_or_faq.forEach((faq, index) => {
                const item = document.createElement('div');
                item.className = 'faq-item';
                
                item.innerHTML = `
                    <button class="faq-question" onclick="toggleFaq(${index})">
                        ${faq.question}
                    </button>
                    <div class="faq-answer" id="faq-ans-${index}">
                        <div class="faq-answer-content">
                            <p>${faq.answer.replace(/\n/g, '<br>')}</p>
                            <div class="faq-meta">
                                <span>Phân loại: <strong style="color: #fff;">${faq.category}</strong></span>
                                <span>Nguồn: <strong style="color: var(--accent-color);">${faq.source}</strong></span>
                                <span>Độ tin cậy: <strong style="color: var(--success-color);">${faq.confidence}</strong></span>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function toggleFaq(index) {
            const activeItem = document.querySelectorAll('.faq-item')[index];
            const answer = document.getElementById(`faq-ans-${index}`);
            
            if (activeItem.classList.contains('active')) {
                activeItem.classList.remove('active');
                answer.style.maxHeight = '0px';
            } else {
                activeItem.classList.add('active');
                answer.style.maxHeight = answer.scrollHeight + 'px';
            }
        }
    </script>
</body>
</html>
